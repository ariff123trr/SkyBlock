<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC-Block - Minecraft Sunucusu</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0b0b0e;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- HEADER / NAVBAR (Görsel 32) -->
    <header class="w-full bg-[#0b0b0e] border-b border-zinc-800/50 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-10">
            <!-- Logo -->
            <div class="flex items-center space-x-3 cursor-pointer">
                <div class="w-10 h-10 bg-amber-600 rounded flex items-center justify-center font-bold text-lg shadow-lg shadow-amber-600/20">
                    <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23fbbf24'><rect width='24' height='24' rx='4'/></svg>" alt="Logo" class="w-8 h-8">
                </div>
            </div>
            <!-- Menü Linkleri -->
            <nav class="hidden xl:flex items-center space-x-6 text-sm font-medium text-zinc-300">
                <a href="#" class="hover:text-white transition">Anasayfa</a>
                <a href="#" class="hover:text-white transition">Oyunlar</a>
                <a href="#" class="text-fuchsia-400 font-semibold transition">Kredi Satın Al</a>
                <a href="#" class="hover:text-white transition">Mağaza</a>
                <a href="#" class="hover:text-white transition">Destek</a>
                <a href="#" class="hover:text-white transition">Yetkili Başvuru</a>
                <a href="#" class="hover:text-white transition">Cezalar</a>
                <a href="#" class="hover:text-white transition">AFK Client</a>
                <a href="#" class="hover:text-white transition">İndir</a>
            </nav>
        </div>

        <!-- Sağ Taraf: Sepet ve Kullanıcı Menüsü -->
        <div class="flex items-center space-x-6">
            <div class="relative cursor-pointer">
                <svg class="w-6 h-6 text-zinc-300 hover:text-white transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                <span class="absolute -top-2 -right-2 bg-emerald-500 text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">0</span>
            </div>
            <div class="border-l border-zinc-800 pl-6 flex items-center space-x-3 cursor-pointer">
                <div class="w-9 h-9 bg-yellow-200 rounded-lg flex items-center justify-center text-black font-bold text-xs">
                    <div class="w-6 h-4 bg-black rounded-b-full mt-1"></div>
                </div>
                <div>
                    <div class="text-sm font-bold text-white">Pund1k</div>
                    <div class="text-[10px] text-zinc-400">MENU</div>
                </div>
            </div>
        </div>
    </header>

    <!-- İÇERİK ALANI (Örnek: Kredi Yükleme Sayfası - Görsel 34) -->
    <main class="flex-grow max-w-7xl mx-auto w-full p-6 space-y-6">
        <!-- Breadcrumb -->
        <div class="text-xs text-zinc-400 flex items-center space-x-2">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            <span>/</span>
            <span>Profil</span>
            <span>/</span>
            <span class="text-white">Kredi Yükle</span>
        </div>

        <!-- Başlık -->
        <h1 class="text-2xl font-bold tracking-wide">Kredi Yükle</h1>

        <!-- Kampanya Kutusu -->
        <div class="bg-amber-950/30 border border-amber-600/30 rounded-lg p-4 text-amber-400 text-sm flex items-center space-x-2">
            <span>⚠️</span>
            <span>50 kredi ve üzeri yüklemelerde %100 bonus!</span>
        </div>

        <!-- Form Alanı -->
        <div class="bg-zinc-900/50 border border-zinc-800/60 rounded-xl p-6 space-y-6">
            <!-- Miktar Girişi -->
            <div class="space-y-2">
                <label class="text-xs font-semibold text-zinc-400">Miktar</label>
                <input type="number" placeholder="Miktarı girin." class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-amber-500 transition">
            </div>

            <!-- Ödeme Yöntemleri -->
            <div class="space-y-2">
                <label class="text-xs font-semibold text-zinc-400">Ödeme Yöntemi</label>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="border border-amber-500 bg-amber-500/5 rounded-lg p-4 cursor-pointer">
                        <div class="text-sm font-medium">Yurt İçi Ödeme (PayTR)</div>
                    </div>
                    <div class="border border-zinc-800 bg-zinc-950 rounded-lg p-4 cursor-pointer hover:border-zinc-700 transition">
                        <div class="text-sm font-medium text-zinc-400">PayTR (Havale & EFT)</div>
                    </div>
                    <div class="border border-zinc-800 bg-zinc-950 rounded-lg p-4 cursor-pointer hover:border-zinc-700 transition">
                        <div class="text-sm font-medium text-zinc-400">Paywant</div>
                    </div>
                </div>
            </div>

            <!-- Onay Kutusu -->
            <div class="flex items-center space-x-2 pt-2">
                <input type="checkbox" id="terms" class="rounded bg-zinc-950 border-zinc-800 text-amber-500 focus:ring-0">
                <label for="terms" class="text-xs text-zinc-400 cursor-pointer"><span class="text-white font-medium">Hizmet Politikası</span> kabul ediyorum.</label>
            </div>

            <!-- İşlem Butonu -->
            <button class="w-full bg-gradient-to-r from-amber-500 to-orange-500 text-white font-semibold py-3 rounded-lg shadow-lg shadow-amber-600/20 hover:opacity-90 transition">
                Kredi Yükle
            </button>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="w-full border-t border-zinc-800/50 py-6 text-center text-xs text-zinc-500">
        MC-Block © 2026 - Tüm hakları saklıdır.
    </footer>

</body>
</html>
